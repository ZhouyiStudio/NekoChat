name: NekoChat
version: '${version}'
main: com.zhouyi.nekochat.NekoChat
api-version: '1.21'
author: NekoChat
description: 聊天管理插件 - 头衔/屏蔽词/禁言 (by Zhouyi)

commands:
  ptitle:
    description: 设置或移除头衔
    usage: /ptitle add <头衔> | /ptitle remove
    aliases: [title, prefix]
  cban:
    description: 管理屏蔽词
    usage: /cban add <词汇> | /cban remove <词汇> | /cban list
    permission: nekochat.cban
  mute:
    description: 禁言玩家
    usage: /mute <玩家> [时间(数字+s/m/h/d)]
    permission: nekochat.mute
  unmute:
    description: 解除禁言
    usage: /unmute <玩家>
    permission: nekochat.mute
  cwhitelist:
    description: 管理宣传检测白名单
    usage: /cwhitelist add <词汇> | /cwhitelist remove <词汇> | /cwhitelist list
    permission: nekochat.cban

permissions:
  nekochat.ptitle:
    description: 允许使用头衔功能
    default: true
  nekochat.cban:
    description: 允许管理屏蔽词
    default: op
  nekochat.mute:
    description: 允许禁言/解禁玩家
    default: op
  nekochat.bypass.cban:
    description: 绕过屏蔽词检测
    default: op
  nekochat.bypass.mute:
    description: 绕过禁言
    default: op
