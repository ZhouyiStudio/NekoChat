name: NekoChat
version: '${version}'
main: com.zhouyi.nekochat.NekoChat
api-version: '1.21'
author: NekoChat
description: 聊天管理插件 - 头衔/屏蔽词/禁言/自定义管理员 (by Zhouyi)

commands:
  ptitle:
    description: 设置或移除头衔
    usage: |
      /ptitle add <玩家> <头衔>   - 给玩家设置头衔
      /ptitle remove <玩家>      - 移除玩家头衔
    aliases: [title, prefix]
  cban:
    description: 管理屏蔽词
    usage: /cban add <词汇> | /cban remove <词汇> | /cban list
  mute:
    description: 禁言玩家
    usage: /mute <玩家> [时间(数字+s/m/h/d)]
  unmute:
    description: 解除禁言
    usage: /unmute <玩家>
  cwhitelist:
    description: 管理宣传检测白名单
    usage: /cwhitelist add <词汇> | /cwhitelist remove <词汇> | /cwhitelist list
  nchat:
    description: 显示插件帮助、重载配置或管理管理员
    usage: |
      /nchat          - 显示帮助
      /nchat reload   - 重载所有配置（含 AI）
      /nchat reload ai - 仅重载 AI 配置
      /nchat op add <玩家>    - 添加管理员
      /nchat op remove <玩家> - 移除管理员
      /nchat op list          - 查看管理员列表
  ai:
    description: AI 助手（支持 OpenAI 兼容 API）
    usage: |
      /ai <消息>      - 向 AI 提问
      /ai <提示词> <消息> - 使用指定提示词提问
  aiban:
    description: 管理 AI 封禁
    usage: |
      /aiban <玩家>   - 禁止玩家使用 AI
      /aiban remove <玩家> - 解除封禁
      /aiban list     - 查看封禁列表

permissions:
  nekochat.nchat:
    description: 允许使用 /nchat 管理命令
    default: op
  nekochat.bypass.cban:
    description: 绕过屏蔽词检测
    default: op
  nekochat.bypass.mute:
    description: 绕过禁言
    default: op
