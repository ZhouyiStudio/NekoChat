# NekoChat 配置文件

# 调试模式（开启后控制台输出详细写入日志）
debug: false

# 头衔格式
title-format: "&7[&r{title}&7]"

# === 数据库 ===
database:
  # MySQL 数据库配置（不配置或留空则不启用聊天记录）
  host: localhost
  port: 3306
  database: nekochat
  user: root
  password: ""
  table-prefix: nc_
  # 连接池设置
  pool-size: 10
  connection-timeout: 5000

# === 禁言 ===
mute-message: "&c你已被禁言{reason}&c！"

# === 屏蔽词 ===
cban-message: "&c消息包含违规词汇，已拦截！"

# 默认屏蔽词列表（自动添加）
banned-words:
  # 中文
  - "操你妈"
  - "你妈逼"
  - "草泥马"
  - "傻逼"
  - "尼玛"
  - "艹"
  - "妈的"
  - "去死"
  - "废物"
  - "滚蛋"
  - "狗屎"
  - "垃圾"
  - "白痴"
  - "脑残"
  # 英文
  - "fuck"
  - "shit"
  - "bitch"
  - "asshole"
  - "bastard"
  - "damn"
  - "cock"
  - "dick"
  - "pussy"
  - "whore"
  - "slut"
  - "nigger"
  - "cunt"
  - "motherfucker"

# === 服务器宣传检测 ===
# 开启后，聊天消息中出现 IP 地址或外站域名将被拦截
server-ad-check: true
server-ad-message: "&c请勿宣传其他服务器！"
# 宣传检测白名单（包含这些关键词的消息不会被拦截）
server-ad-whitelist:
  - "3d3k.org"
  - "3d3k.discourse.group"

# === AI 助手 ===
# 支持任何 OpenAI 兼容 API（OpenAI、ModelScope、Azure OpenAI 等）
ai:
  # 是否启用 AI 功能
  enabled: false
  # OpenAI 兼容 API 地址
  # ModelScope: https://api-inference.modelscope.cn/v1/chat/completions
  # OpenAI:     https://api.openai.com/v1/chat/completions
  # 自定义:     你的 API 地址 + /chat/completions
  api-url: "https://api-inference.modelscope.cn/v1/chat/completions"
  # API 密钥
  api-key: ""
  # 模型名称
  # ModelScope 示例: Qwen/Qwen2.5-7B-Instruct
  # OpenAI 示例:     gpt-4o-mini
  model: "Qwen/Qwen2.5-7B-Instruct"
  # 系统提示词
  system-prompt: "你是 NekoChat AI，一个 Minecraft 服务器中的智能助手。请用中文回复，回答简洁友好。每次回答不要太长。"
  # 单次最大 Token 数
  max-tokens: 512
  # API 请求超时（秒）
  timeout-seconds: 30
  # 玩家冷却时间（秒）
  cooldown-seconds: 20
  # 回复是否发送到公聊（true=全服广播，false=仅提问者可见）
  public-reply: true
  # AI 显示名称（支持 & 颜色代码）
  display-name: "&b[AI助手]"
  # 每日使用次数限制（0=不限制）
  daily-limit: 10
  # === 自定义提示词 ===
  # 预设的系统提示词，玩家可用 @ai <提示词名> <消息> 或 /ai <提示词名> <消息> 来调用
  # 示例: @ai 翻译 你好  -> 使用 "翻译" 提示词
  prompts:
    翻译: "你是一个翻译助手，请将用户的输入翻译成英文，只输出翻译结果。"
    笑话: "你是一个讲笑话的 AI，用中文讲一个简短有趣的笑话。"
    代码: "你是编程专家，用中文解释代码问题，给出简洁的代码示例。"
