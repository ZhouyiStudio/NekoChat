# NekoChat 配置文件

# 调试模式（开启后控制台输出详细写入日志）
debug: false

# 头衔格式
title-format: "&7[&r{title}&7]"

# === 数据库 ===
database:
  # MySQL 数据库配置（不配置或留空则不启用聊天记录）
  host: localhost
  port: 3306
  database: nekochat
  user: root
  password: ""
  table-prefix: nc_
  # 连接池设置
  pool-size: 10
  connection-timeout: 5000

# === 禁言 ===
mute-message: "&c你已被禁言{reason}&c！"

# === 屏蔽词 ===
cban-message: "&c消息包含违规词汇，已拦截！"

# 默认屏蔽词列表（自动添加）
banned-words:
  # 中文
  - "操你妈"
  - "你妈逼"
  - "草泥马"
  - "傻逼"
  - "尼玛"
  - "艹"
  - "妈的"
  - "去死"
  - "废物"
  - "滚蛋"
  - "狗屎"
  - "垃圾"
  - "白痴"
  - "脑残"
  # 英文
  - "fuck"
  - "shit"
  - "bitch"
  - "asshole"
  - "bastard"
  - "damn"
  - "cock"
  - "dick"
  - "pussy"
  - "whore"
  - "slut"
  - "nigger"
  - "cunt"
  - "motherfucker"

# === 服务器宣传检测 ===
# 开启后，聊天消息中出现 IP 地址或外站域名将被拦截
server-ad-check: true
server-ad-message: "&c请勿宣传其他服务器！"
# 宣传检测白名单（包含这些关键词的消息不会被拦截）
server-ad-whitelist:
  - "3d3k.org"
  - "3d3k.discourse.group"
